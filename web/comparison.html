<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script src="plotly-geo-assets.js"></script>
<script>
"use strict";
(async function startComparison() {
const COPY = (await (await fetch("content.json", { cache: "no-store" })).json()).comparison;
if (!COPY) throw new Error("Missing comparison editorial content in content.json");
const D = await (await fetch("comparison-data.json")).json();
const U = COPY.ui;

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const dig = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const fmt = (x, d = 1) => x == null || isNaN(x) ? "–" : Number(x).toFixed(d);
const signed = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const median = a => { const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const range = (a, d = 1) => `${fmt(Math.min(...a), d)}–${fmt(Math.max(...a), d)}`;
for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = dig(COPY, el.dataset.t);
document.title = COPY.title;
$("tabs").innerHTML = Object.entries(COPY.tabs).map(([k, label]) => `<a href="#${k}">${label}</a>`).join("");

const MODELS = Object.keys(COPY.models);                 // internal ids C, D, E are never shown
const VARIANTS = Object.keys(COPY.variants);
const mname = id => COPY.models[id].name;
const vlabel = id => COPY.variants[id].label;
const col = id => css("--m-" + id);
const pcol = p => css("--p-" + p);
const METRIC = COPY.metrics;
const DIGITS = { cov80: 2, r2: 3, crps: 2, calib: 3, n: 0 };
const mfmt = (k, x) => k === "n" ? Number(x).toLocaleString("en") : fmt(x, DIGITS[k] ?? 1);

/* ---------------- the one tooltip (legends, effect chips, table headers) ---------------- */
const tipEl = document.body.appendChild(Object.assign(document.createElement("div"), { className: "tip", hidden: true }));
tipEl.setAttribute("role", "tooltip");
const tipAttr = html => `data-tip="${esc(html)}" tabindex="0"`;
const modelTip = id => `<b>${mname(id)}</b>${COPY.models[id].desc}`;
const variantTip = id => `<b>${vlabel(id)}</b>${COPY.variants[id].desc}`;
const metricTip = k => `<b>${METRIC[k].label}</b>${METRIC[k].tip}`;
function showTip(target) {
  tipEl.innerHTML = target.dataset.tip; tipEl.hidden = false;
  const r = target.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + "px";
  tipEl.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 8 : Math.max(8, r.top - h - 8)) + "px";
}
const onPoint = e => { const t = e.target.closest?.("[data-tip]"); if (t) showTip(t); else tipEl.hidden = true; };
document.addEventListener("mouseover", onPoint);
document.addEventListener("focusin", onPoint);
document.addEventListener("focusout", () => { tipEl.hidden = true; });
window.addEventListener("scroll", () => { tipEl.hidden = true; }, { passive: true });

/* ---------------- controls ---------------- */
// Segmented buttons: options [{v, label}], returns a getter for the pressed value.
function seg(id, options, def, onChange) {
  const el = $(id); el.classList.add("seg");
  el.innerHTML = options.map(o => `<button type="button" data-v="${esc(o.v)}" aria-pressed="${o.v === def}">${o.label}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); onChange(); };
  return () => el.querySelector('[aria-pressed="true"]').dataset.v;
}
// Clickable legend: items [{id, label, color, hatch, tip}]. Click hides/restores a series; returns the visibility test.
const hiddenSeries = {};
function legend(hostId, items, onChange) {
  const hide = hiddenSeries[hostId] ??= new Set(), host = $(hostId);
  host.className = "legend";
  host.innerHTML = items.map(i => `<button type="button" class="leg" data-id="${esc(i.id)}" aria-pressed="${!hide.has(i.id)}" ${tipAttr(i.tip)}><span class="sw${i.hatch ? " hatch" : ""}" style="--c:${i.color}"></span>${i.label}</button>`).join("");
  host.onclick = e => { const b = e.target.closest(".leg"); if (!b) return;
    hide.has(b.dataset.id) ? hide.delete(b.dataset.id) : hide.add(b.dataset.id); onChange(); };
  return id => !hide.has(id);
}
const modelItems = () => MODELS.map(id => ({ id, label: mname(id), color: col(id), tip: modelTip(id) }));
const variantItems = ids => ids.map(id => ({ id, label: vlabel(id), color: col(COPY.variants[id].model), hatch: COPY.variants[id].input === "in-situ S", tip: variantTip(id) }));
const variantOptions = () => VARIANTS.map(id => ({ v: id, label: vlabel(id) }));
const headCell = (k, label, cls = "num") => `<th class="${cls}" ${tipAttr(metricTip(k))}>${label ?? METRIC[k].label}</th>`;
// Model column header: the name in the model colour (no swatch), free to wrap
const modelHead = id => `<th class="num model" style="color:${col(id)}" ${tipAttr(modelTip(id))}>${mname(id)}</th>`;

/* ---------------- plotly layouts ---------------- */
function baseLayout(extra = {}) {
  const ink2 = css("--ink-2"), grid = css("--grid"), rule = css("--rule");
  const axis = { gridcolor: grid, linecolor: rule, zerolinecolor: rule, tickfont: { color: ink2 }, automargin: true };
  return Object.assign({
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: { family: css("--f-body"), color: ink2, size: 12 },
    margin: { l: 56, r: 12, t: 10, b: 48 }, xaxis: axis, yaxis: axis, showlegend: false,
    hoverlabel: { bgcolor: css("--panel"), bordercolor: rule, font: { color: css("--ink"), family: css("--f-body") } },
  }, extra);
}
const axisOf = (title, extra = {}) => Object.assign(baseLayout().yaxis, { title: { text: title, font: { size: 12 } } }, extra);
const CFG = { displayModeBar: false, responsive: true };
function geoLayout() {
  return baseLayout({ margin: { l: 0, r: 0, t: 0, b: 0 },
    geo: { projection: { type: "natural earth" }, showland: true, landcolor: css("--map-land"), showocean: true, oceancolor: css("--map-ocean"),
      showcoastlines: false, showcountries: false, showframe: false, bgcolor: "rgba(0,0,0,0)", lataxis: { range: [-80, 90] } } });
}
const hatchOf = (color, on) => on ? { color: css("--panel"), line: { color, width: 1.5 }, pattern: { shape: "/", fgcolor: color, size: 6, solidity: 0.35 } } : { color, line: { color, width: 1.5 } };

/* ---------------- locator map (held-out tab): shows where a group's rows are ---------------- */
const P = D.pts;
function makeLocator(divId, chipsId, memberFn, labelFn, onSelect) {
  const st = { sel: null, hover: null, groups: [] }, div = $(divId), chips = $(chipsId);
  function draw() {
    const g = st.hover ?? st.sel, on = [], off = [];
    for (let i = 0; i < P.lat.length; i++) (g != null && memberFn(i, g) ? on : off).push(i);
    const tr = (idx, color, size, name) => ({ type: "scattergeo", mode: "markers", lat: idx.map(i => P.lat[i]), lon: idx.map(i => P.lon[i]),
      marker: { size, color, opacity: 0.9, line: { width: 0 } }, customdata: idx, hovertemplate: "%{lat:.1f}°, %{lon:.1f}°<extra>" + name + "</extra>", name });
    Plotly.react(div, [tr(off, css("--muted-pt"), 3, "other"), tr(on, "#f2b134", 4.5, g != null ? labelFn(g) : "")], geoLayout(), CFG);
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.g === String(g)));
  }
  const set = (g, hover) => { hover ? st.hover = g : (st.sel = g, st.hover = null); draw(); onSelect(); };
  chips.addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) set(c.dataset.g); });
  chips.addEventListener("mouseover", e => { const c = e.target.closest(".chip"); if (c) set(c.dataset.g, true); });
  chips.addEventListener("mouseleave", () => set(null, true));
  let bound = false;
  const bind = () => { if (bound) return; bound = true;
    div.on("plotly_click", ev => { const g = st.groups.find(g => memberFn(ev.points[0].customdata, g)); if (g != null) set(g); }); };
  return { current: () => st.hover ?? st.sel, hover: g => set(g, true), select: g => set(g),
    setGroups(groups) { st.groups = groups; if (!groups.includes(st.sel)) st.sel = groups[0] ?? null; st.hover = null;
      chips.innerHTML = groups.map(g => `<button class="chip" data-g="${esc(g)}">${labelFn(g)}</button>`).join(""); draw(); bind(); } };
}

/* ---------------- region helpers (validation regions) ---------------- */
const REGIONS = ["all", "oceanic & < 60deg", "coastal & < 60deg", "oceanic & > 60deg", "coastal & > 60deg", "oceanic", "coastal", "> 60deg"];
const regName = r => COPY.regions[r][0];
const regDef = r => COPY.regions[r][1];
const regLabel = r => regName(r) + (regDef(r) ? ` (${regDef(r)})` : "");
function regMember(i, r) {
  const hi = Math.abs(P.lat[i]) > 60, co = P.region[i] === "coastal";
  return r === "all" || (r === "oceanic" && !co) || (r === "coastal" && co) || (r === "> 60deg" && hi) ||
    (r === "oceanic & < 60deg" && !co && !hi) || (r === "coastal & < 60deg" && co && !hi) || (r === "oceanic & > 60deg" && !co && hi) || (r === "coastal & > 60deg" && co && hi);
}

/* ---------------- OVERVIEW ---------------- */
// One measured effect of a step: the change in a held-out metric between two variants.
function effectOf(e) {
  const sub = D.heldout[e.subset || "glodap"];
  const get = v => e.grouping === "overall" ? sub.overall[v] : sub[e.grouping]?.[v]?.[e.group];
  const a = get(e.baseline), b = get(e.variant);
  if (!a || !b) return null;
  const x = a[e.metric], y = b[e.metric], d = y - x;
  const better = e.metric === "cov80" ? Math.abs(y - 0.8) < Math.abs(x - 0.8) : d < 0;
  const text = e.metric === "cov80" ? `${signed(d * 100)} pp` : signed(d);
  const def = e.group ? COPY.group_defs[`${e.grouping}:${e.group}`] ?? "" : "";
  const tip = `<b>${e.label}</b>${vlabel(e.baseline)}: ${mfmt(e.metric, x)} (n = ${a.n.toLocaleString("en")})<br>${vlabel(e.variant)}: ${mfmt(e.metric, y)} (n = ${b.n.toLocaleString("en")})<br>${def} ${U.subset_glodap}.`;
  return `<span class="effect ${better ? "good" : "bad"}" ${tipAttr(tip)}>${d > 0 ? "↑" : "↓"} ${e.label} ${text}</span>`;
}
function renderOverview() {
  const sub = D.heldout.glodap, o = sub.overall;
  const score = (v, h) => h.grouping === "overall" ? o[v] : sub[h.grouping]?.[v]?.[h.group];
  // Two question cards: the headline change of each step, a one-line answer and the measured effects
  $("questions").innerHTML = COPY.questions.map(q => {
    const h = q.headline, a = score(h.baseline, h), b = score(h.variant, h);
    const chips = COPY.effects.filter(e => e.model === q.model).map(effectOf).filter(Boolean).join("");
    return `<article class="q" style="--c:${col(q.model)}"><p class="qk">${q.kicker}</p><h3>${q.title}</h3>
      <div class="big"><span>${mfmt(h.metric, a[h.metric])}</span><i>→</i><b>${mfmt(h.metric, b[h.metric])}</b></div>
      <p class="bigcap">${h.label} · n = ${b.n.toLocaleString("en")}</p><p>${q.answer}</p>
      <div class="fx">${chips}</div><a href="${q.link.href}">${q.link.label}</a></article>`;
  }).join("");
  // Ladder: held-out MAE of each model, predicted with in-situ salinity (hollow) and with gridded salinity (filled)
  const max = 1.12 * Math.max(...VARIANTS.map(v => o[v]?.mae ?? 0)), pos = x => (100 * x / max).toFixed(1) + "%";
  const pt = (v, hollow) => `<span class="pt${hollow ? " hollow" : ""}" style="left:${pos(o[v].mae)}" ${tipAttr(variantTip(v) + `<br>${METRIC.mae.label} ${fmt(o[v].mae)} (n = ${o[v].n.toLocaleString("en")})`)}><em>${fmt(o[v].mae)}</em></span>`;
  $("ladder").innerHTML = MODELS.map((id, i) => {
    const m = COPY.models[id], a = m.insitu_variant, b = m.gridded_variant;
    const link = a ? `<i class="link" style="left:${pos(o[a].mae)};width:${pos(o[b].mae - o[a].mae)}"></i>` : "";
    return `<div class="mrow" style="--c:${col(id)}"><div><span class="step">${i ? COPY.edges[i - 1].label : COPY.baseline_label}</span>
      <h4 ${tipAttr(modelTip(id))}>${m.name}</h4><small>${m.data} · ${U.salinity_pred}: ${m.salinity}</small></div>
      <div class="track">${link}${a ? pt(a, true) : ""}${pt(b, false)}</div></div>`;
  }).join("") + `<div class="mrow axisrow"><div></div><div class="axis">${[0, 5, 10, 15, 20, 25, 30].filter(t => t < max).map(t => `<span style="left:${pos(t)}">${t}</span>`).join("")}</div></div>`;
  $("ladderLegend").innerHTML = `<span><i class="pt-key"></i>${COPY.ladder_legend.insitu}</span><span><i class="pt-key full"></i>${COPY.ladder_legend.gridded}</span>`;
  $("limitations").innerHTML = COPY.limitations.map(t => `<li>${t}</li>`).join("");
}

/* ---------------- HELD-OUT ---------------- */
const GROUP_ORDER = {
  valregion: REGIONS, latband: ["0–20°", "20–40°", "40–60°", "≥60°"], region: ["coastal", "oceanic"],
  basin: ["Pacific", "Atlantic", "Indian", "Southern Ocean", "Arctic / subpolar N", "Mediterranean"],
  salbin: ["<30", "30–33", "33–34", "34–35", "35–36", "36–37", "≥37"], year: ["1980", "1985", "1990", "1995", "2000", "2005", "2010", "2015", "2020"],
  cci: ["True", "False"], dataset: ["test", "validation"], source: ["GLODAP", "CARIMED"] };
const gl = (by, g) => by === "valregion" ? regLabel(g) : by === "year" ? `${g}–${String(+g + 4).slice(2)}` : COPY.group_labels[by]?.[g] ?? g;
// A grouping appears as soon as heldout.*.<grouping> exists in the data ("valregion" needs per-region scores of the 8 validation regions).
const GROUPINGS = Object.keys(GROUP_ORDER).filter(g => D.heldout.glodap[g] && D.heldout.all[g]);
$("hoGroup").innerHTML = GROUPINGS.map(g => `<option value="${g}">${COPY.groupings[g]}</option>`).join("");
$("hoGroup").value = GROUPINGS.includes("latband") ? "latband" : GROUPINGS[0];
$("hoGroup").onchange = () => renderHeldout();
const hoSubset = seg("hoSubset", [{ v: "glodap", label: U.rows_glodap }, { v: "all", label: U.rows_all }], "glodap", () => renderHeldout());
const hoMetric = seg("hoMetric", ["mae", "rmse", "bias", "cov80", "width"].map(k => ({ v: k, label: METRIC[k].label })), "mae", () => renderHeldout());

  else { t = Math.min(1, v / (m === "quantile_crps" ? 25 : 50)); hue = "--site-teal"; }

const PROTECTED = ["salinity", "temperature"];
function renderFeatures() {
  const vis = legend("ftLegend", modelItems(), renderFeatures), shown = MODELS.filter(vis);
  const fi = id => Object.fromEntries(D.ensemble[id].importance.map(x => [x.feature, x.mean]));
  const feats = [...new Set(MODELS.flatMap(id => D.ensemble[id].importance.map(x => x.feature)))];
  const sum = (f, get) => MODELS.reduce((a, id) => a + (get(id)[f] ?? 0), 0);
  const drops = id => { const c = {}; D.ensemble[id].members.forEach(m => m.dropped.forEach(f => c[f] = (c[f] || 0) + 1)); return c; };
  const byImportance = [...feats].sort((a, b) => sum(b, fi) - sum(a, fi));
  const droppable = feats.filter(f => !PROTECTED.includes(f)).sort((a, b) => sum(a, drops) - sum(b, drops));
  const layout = extra => baseLayout({ barmode: "group", bargap: 0.25, margin: { l: 120, r: 12, t: 10, b: 44 }, ...extra });
  Plotly.react("fiChart", shown.map(id => ({ type: "bar", orientation: "h", name: mname(id), y: byImportance, x: byImportance.map(f => fi(id)[f] ?? null), marker: { color: col(id) },
    hovertemplate: `<b>${mname(id)}</b> %{y}: %{x:.1f} %<extra></extra>` })),
    layout({ yaxis: Object.assign(baseLayout().yaxis, { autorange: "reversed" }), xaxis: Object.assign(baseLayout().xaxis, { title: { text: U.importance_x } }) }), CFG);
  const nMembers = D.ensemble[MODELS[0]].members.length;
  Plotly.react("dropChart", shown.map(id => ({ type: "bar", orientation: "h", name: mname(id), y: droppable, x: droppable.map(f => drops(id)[f] ?? 0), marker: { color: col(id) },
    hovertemplate: `<b>${mname(id)}</b> %{y}: dropped by %{x} of ${nMembers}<extra></extra>` })),
    layout({ yaxis: Object.assign(baseLayout().yaxis, { autorange: "reversed" }), xaxis: Object.assign(baseLayout().xaxis, { title: { text: U.members_x.replace("{n}", nMembers) }, range: [0, nMembers] }) }), CFG);
}

/* ---------------- ENSEMBLE HPO ---------------- */
const hpParam = seg("hpParam", Object.entries(COPY.hp_params).map(([v, label]) => ({ v, label })), "learning_rate", () => renderHpo());
const hpMode = seg("hpMode", [{ v: "all", label: U.hp_all }, { v: "best", label: U.hp_best }], "all", () => renderHpo());
const bySplit = id => { const g = {}; D.ensemble[id].members.forEach(m => (g[m.member.split("_")[1]] ??= []).push(m)); return g; };
function renderHpo() {
  const p = hpParam(), mode = hpMode();
  const vis = legend("hpLegend", modelItems(), renderHpo), shown = MODELS.filter(vis);
  const picked = id => mode === "all" ? D.ensemble[id].members : Object.values(bySplit(id)).map(ms => ms.reduce((a, b) => b.loss < a.loss ? b : a));
  Plotly.react("hpChart", shown.map(id => ({ type: "box", name: mname(id), y: picked(id).map(m => m[p]), boxpoints: "all", jitter: 0.5, pointpos: 0, text: picked(id).map(m => m.member),
    marker: { color: col(id), size: 6 }, line: { color: col(id), width: 1.5 }, fillcolor: "rgba(0,0,0,0)", hovertemplate: `<b>${mname(id)}</b> %{text}<br>${COPY.hp_params[p]} %{y}<extra></extra>` })),
    baseLayout({ yaxis: axisOf(COPY.hp_params[p], { type: p === "l2_leaf_reg" ? "log" : "linear" }) }), CFG);
  const setSize = id => Object.fromEntries(Object.entries(bySplit(id)).map(([k, ms]) => [k, ms[0].set_size]));
  Plotly.react("rsChart", shown.map(id => { const s = setSize(id), ks = Object.keys(s).sort();
    return { type: "bar", name: mname(id), x: ks.map(k => `${U.split} ${k}`), y: ks.map(k => s[k]), marker: { color: col(id) }, hovertemplate: `<b>${mname(id)}</b> %{x}: %{y} trials<extra></extra>` }; }),
    baseLayout({ barmode: "group", bargap: 0.25, yaxis: axisOf(U.setsize_y) }), CFG);
  const stat = { set: id => range(Object.values(setSize(id)), 0), loss: id => range(D.ensemble[id].members.map(m => m.loss), 2),
    iters: id => { const it = D.ensemble[id].members.map(m => m.iters); return `${fmt(median(it), 0)} (${range(it, 0)})`; },
    combos: id => new Set(D.ensemble[id].members.map(m => [...m.dropped].sort().join("|"))).size,
    nodrop: id => { const ms = D.ensemble[id].members; return `${fmt(ms.filter(m => !m.dropped.length).length / ms.length * 100, 0)} %`; } };
  $("hpStats").innerHTML = `<thead><tr><th>${U.stat}</th>${MODELS.map(modelHead).join("")}</tr></thead><tbody>` +
    COPY.hpo_stats.map(s => `<tr><td ${tipAttr(`<b>${s.label}</b>${s.tip}`)}>${s.label}</td>${MODELS.map(id => `<td class="num">${stat[s.key](id)}</td>`).join("")}</tr>`).join("") + "</tbody>";
}

/* ---------------- routing ---------------- */
const RENDER = { overview: renderOverview, heldout: () => { renderHeldout(); renderScatter(); }, map: renderMap, salinity: renderSalinity,
  stations: () => { renderStTable(); renderStLoc(); renderTs(); },
  features: renderFeatures, hpo: renderHpo };
const VIEWS = Object.keys(RENDER);
let current = null;
function show() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
  VIEWS.forEach(x => $("v-" + x).hidden = x !== v);
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + v ? "page" : "false"));
  current = v; RENDER[v]();
}
window.addEventListener("hashchange", () => { show(); window.scrollTo({ top: 0 }); });
const rerender = () => { if (current) RENDER[current](); };
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender);
window.matchMedia("(max-width: 700px)").addEventListener("change", rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
show();
})();
</script>
</body>
</html>
